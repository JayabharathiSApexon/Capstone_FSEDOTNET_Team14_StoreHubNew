name: Deploy StoreHub UI to Azure Static Web Apps

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/storehub-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/storehub-ui
        run: npm ci

      - name: Build React application
        working-directory: frontend/storehub-ui
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/storehub-ui
          output_location: dist
          skip_app_build: true
